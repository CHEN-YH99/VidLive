name: vidlive

services:
  postgres:
    image: postgres:16-alpine
    container_name: vidlive-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vidlive
    # P2-30: 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
        reservations:
          cpus: '0.25'
          memory: 256M
    # P2-31: 安全选项
    security_opt:
      - no-new-privileges:true
    # P2-33: 能力限制
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  redis:
    image: redis:7-alpine
    container_name: vidlive-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vidlive
    # P2-30: 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 50
        reservations:
          cpus: '0.1'
          memory: 128M
    # P2-31: 安全选项
    security_opt:
      - no-new-privileges:true
    # P2-33: 能力限制（Redis 需要更多能力）
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: vidlive-migrate
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    command:
      [
        "sh",
        "-c",
        "if [ -f apps/api/prisma/schema.prisma ] && pnpm exec prisma --version >/dev/null 2>&1; then pnpm exec prisma migrate deploy --schema apps/api/prisma/schema.prisma; elif [ -f prisma/schema.prisma ] && pnpm exec prisma --version >/dev/null 2>&1; then pnpm exec prisma migrate deploy --schema prisma/schema.prisma; elif [ -f apps/api/prisma/schema.prisma ] || [ -f prisma/schema.prisma ]; then echo 'Prisma schema found, but prisma CLI is not installed. Skip migration.'; else echo 'No Prisma schema found, skip migration'; fi"
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vidlive
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: vidlive-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 8000
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3010}:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 8000) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - vidlive
    # P2-30: 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 200
        reservations:
          cpus: '0.5'
          memory: 512M
    # P2-31: 安全选项
    security_opt:
      - no-new-privileges:true
    # P2-33: 能力限制
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    # P2-32: 临时文件系统（可选，会影响性能）
    # read_only: true
    # tmpfs:
    #   - /tmp
    #   - /app/uploads

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    container_name: vidlive-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - vidlive
    # P2-30: 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 100
        reservations:
          cpus: '0.25'
          memory: 256M
    # P2-31: 安全选项
    security_opt:
      - no-new-privileges:true
    # P2-33: 能力限制
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

  gateway:
    image: nginx:1.27-alpine
    container_name: vidlive-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - vidlive

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  vidlive:
    driver: bridge
